<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b0a10">
<title>Conquistas — Soulsbo</title>
<style>
:root{color-scheme:dark;--bg:#0b0a10;--panel:#15131d;--line:rgba(216,187,122,.22);--gold:#d8bb7a;--text:#f0e9df;--muted:#a7a7b2;--green:#79c99a;--blue:#9bb8de;--red:#d98b8b}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#1d1925 0,#0b0a10 56%);color:var(--text);font:15px/1.5 system-ui,-apple-system,Segoe UI,sans-serif;min-height:100vh}
header{border-bottom:1px solid var(--line);padding:22px 18px}header .wrap,main{max-width:1080px;margin:0 auto}header h1{margin:0;color:var(--gold);font-size:clamp(1.4rem,4vw,2rem)}header p{margin:5px 0 0;color:var(--muted)}
nav{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}a{color:var(--gold);text-decoration:none}a:hover{text-decoration:underline}.navlink{border:1px solid var(--line);border-radius:9px;padding:7px 11px;background:#14121a}
main{padding:24px 18px 60px}.summary{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:20px}.stat,.achievement{border:1px solid var(--line);background:rgba(21,19,29,.93);border-radius:14px;padding:15px}.stat strong{display:block;font-size:1.5rem;color:var(--gold)}.stat span{color:var(--muted);font-size:.85rem}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(245px,1fr));gap:13px}.achievement{display:flex;flex-direction:column;gap:9px;min-height:180px}.achievement h2{font-size:1rem;margin:0;color:var(--gold)}.achievement p{margin:0;color:var(--muted);font-size:.9rem;flex:1}.tag{align-self:flex-start;border:1px solid var(--line);border-radius:20px;padding:3px 9px;font-size:.72rem;color:var(--muted)}.tag.unlocked{border-color:rgba(121,201,154,.5);color:var(--green)}.tag.pending{border-color:rgba(155,184,222,.4);color:var(--blue)}.bar{height:7px;background:#292532;border-radius:10px;overflow:hidden}.bar span{display:block;height:100%;background:linear-gradient(90deg,#94713b,var(--gold));width:0}.progress{font-size:.8rem;color:var(--muted);display:flex;justify-content:space-between;gap:12px}.status{padding:13px 15px;border:1px solid var(--line);border-radius:10px;background:#14121a;color:var(--muted);margin-bottom:18px}.status.error{color:var(--red);border-color:rgba(217,139,139,.4)}.status.ok{color:var(--green)}
@media(max-width:560px){.summary{grid-template-columns:1fr}.stat{display:flex;justify-content:space-between;align-items:center}.stat strong{font-size:1.2rem}}
</style>
</head>
<body>
<header><div class="wrap"><h1>Conquistas do Soulsbo</h1><p>Progresso calculado pelo servidor a partir da sua coleção e das suas partidas.</p><nav><a class="navlink" href="/">Início</a><a class="navlink" href="/card-engine-v2">Card Engine v2</a><a class="navlink" href="/tutorial">Tutorial</a></nav></div></header>
<main>
<div id="status" class="status" role="status" aria-live="polite">Carregando suas conquistas…</div>
<section class="summary" aria-label="Resumo de conquistas">
  <div class="stat"><span>Desbloqueadas</span><strong id="unlocked">—</strong></div>
  <div class="stat"><span>Conquistas cadastradas</span><strong id="total">—</strong></div>
  <div class="stat"><span>Partidas concluídas</span><strong id="matches">—</strong></div>
</section>
<section id="grid" class="grid" aria-label="Lista de conquistas"></section>
</main>
<script>
(() => {
  const statusEl = document.getElementById('status');
  const grid = document.getElementById('grid');
  const setStatus = (message, kind = '') => { statusEl.textContent = message; statusEl.className = `status ${kind}`.trim(); };
  const make = (tag, cls, value) => { const el = document.createElement(tag); if (cls) el.className = cls; if (value !== undefined) el.textContent = String(value); return el; };
  function render(items) {
    grid.replaceChildren();
    for (const item of items) {
      const card = make('article', 'achievement');
      card.append(make('span', 'tag', item.category || 'Geral'));
      card.append(make('h2', '', item.name || 'Conquista'));
      card.append(make('p', '', item.description || ''));
      if (item.status === 'tracking_pending') {
        card.append(make('span', 'tag pending', 'Rastreamento pendente'));
        card.append(make('p', '', item.pending_reason || 'Esta conquista ainda não possui eventos suficientes para acompanhar o progresso.'));
      } else {
        const unlocked = Boolean(item.unlocked);
        card.append(make('span', `tag ${unlocked ? 'unlocked' : ''}`, unlocked ? 'Desbloqueada' : 'Em andamento'));
        const total = Math.max(1, Number(item.total) || 1);
        const progress = Math.min(total, Math.max(0, Number(item.progress) || 0));
        const bar = make('div', 'bar');
        const fill = make('span', '');
        fill.style.width = `${Math.round(progress / total * 100)}%`;
        bar.append(fill);
        card.append(bar);
        card.append(make('div', 'progress', `${progress.toLocaleString('pt-BR')} / ${total.toLocaleString('pt-BR')}`));
        if (unlocked && item.unlocked_at) card.append(make('small', '', `Desbloqueada em ${item.unlocked_at}`));
      }
      grid.append(card);
    }
  }
  async function load() {
    try {
      const syncResponse = await fetch('/api/gwent/conquistas/registrar', {
        method:'POST', credentials:'same-origin', headers:{'Accept':'application/json','Content-Type':'application/json'},
        body:'{}', cache:'no-store'
      });
      if (syncResponse.status === 401) {
        setStatus('Entre com sua conta Discord para consultar suas conquistas.', 'error');
        const link = make('a', 'navlink', 'Entrar com Discord');
        link.href = '/auth/discord/login?next=%2Fconquistas';
        statusEl.append(' ', link);
        return;
      }
      if (!syncResponse.ok) throw new Error('Não foi possível sincronizar seu progresso.');
      const response = await fetch('/api/gwent/conquistas/list', {credentials:'same-origin', headers:{'Accept':'application/json'}, cache:'no-store'});
      const data = await response.json().catch(() => ({}));
      if (response.status === 401) {
        setStatus('Entre com sua conta Discord para consultar suas conquistas.', 'error');
        const link = make('a', 'navlink', 'Entrar com Discord');
        link.href = '/auth/discord/login?next=%2Fconquistas';
        statusEl.append(' ', link);
        return;
      }
      if (!response.ok) throw new Error(data.error || 'Não foi possível carregar as conquistas.');
      const summary = data.summary || {};
      document.getElementById('unlocked').textContent = Number(summary.unlocked || 0);
      document.getElementById('total').textContent = Number(summary.total || 0);
      document.getElementById('matches').textContent = Number(data.metrics?.completed_matches || 0);
      render(Array.isArray(data.achievements) ? data.achievements : []);
      setStatus('Progresso sincronizado com sua coleção e histórico de partidas.', 'ok');
    } catch (error) {
      setStatus(error instanceof Error ? error.message : 'Falha ao carregar conquistas.', 'error');
    }
  }
  load();
})();
</script>
</body>
</html>
