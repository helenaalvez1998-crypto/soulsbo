<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b0a10"><title>Biblioteca de Cartas — Coliseu</title>
<style>
:root{color-scheme:dark;--bg:#0b0a10;--panel:#15131d;--line:rgba(197,170,112,.22);--gold:#d8bb7a;--text:#f0e9df;--muted:#a7a7b2}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% -10%,#2a2030,transparent 55%),var(--bg);color:var(--text);font:14px/1.55 Inter,system-ui,sans-serif}
header{padding:24px max(18px,calc((100vw - 1180px)/2));border-bottom:1px solid var(--line)}header small{color:var(--gold);letter-spacing:.22em}h1{margin:6px 0;color:var(--gold);font:700 clamp(24px,4vw,38px) Georgia,serif}header p{margin:0;color:var(--muted)}
main{max-width:1180px;margin:auto;padding:22px 18px 60px}.toolbar{display:grid;grid-template-columns:minmax(180px,1fr) 180px 180px;gap:10px;margin:18px 0}input,select{width:100%;padding:12px;border:1px solid var(--line);border-radius:9px;background:#111018;color:var(--text)}
.summary{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0;color:var(--muted);font-size:12px}.summary b{color:var(--gold)}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(255px,1fr));gap:12px}.card{position:relative;min-height:210px;padding:16px;border:1px solid var(--line);border-radius:13px;background:linear-gradient(150deg,#201b28,#131119 70%);box-shadow:0 12px 30px #0004}.top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}.name{font:700 16px Georgia,serif;color:#f2e7d1}.pill{border:1px solid var(--line);border-radius:30px;padding:3px 8px;color:var(--gold);font-size:10px;white-space:nowrap}.meta{display:flex;gap:7px;flex-wrap:wrap;margin:10px 0}.meta span{padding:3px 7px;border-radius:6px;background:#ffffff0b;color:#c9bdad;font-size:10px}.desc{color:#bdb4c2;font-size:12px;min-height:48px}.skill{font-size:11px;color:#e1c98f;margin-top:10px}.foot{display:flex;justify-content:space-between;align-items:center;margin-top:12px;border-top:1px solid #ffffff12;padding-top:10px;color:var(--muted);font-size:11px}.power{font:700 18px Georgia,serif;color:var(--gold)}.empty,.error{padding:24px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:12px}.back{display:inline-block;color:var(--gold);text-decoration:none;margin:0 0 12px}.back:hover{text-decoration:underline}
@media(max-width:700px){.toolbar{grid-template-columns:1fr}.card{min-height:0}}
</style><link rel="stylesheet" href="/narabot-polish.css?v=polish1">
</head>
<body>
<header><small>CARTAS DO COLISEU · COMPÊNDIO</small><h1>Biblioteca de Cartas</h1><p>Catálogo completo de modelos cadastrados, incluindo a expansão V75. Esta biblioteca não representa sua coleção pessoal.</p></header>
<main><a class="back" href="/">← Voltar ao Coliseu</a>
<div class="toolbar"><input id="q" type="search" placeholder="Buscar carta, habilidade ou descrição…"><select id="rarity"><option value="">Todas as raridades</option></select><select id="faction"><option value="">Todas as facções</option></select></div>
<div id="summary" class="summary">Carregando catálogo…</div><div id="grid" class="grid"><div class="empty">Carregando cartas…</div></div>
</main>
<script>
const $=id=>document.getElementById(id);let cards=[];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function render(){const q=$('q').value.trim().toLocaleLowerCase('pt-BR'),r=$('rarity').value,f=$('faction').value;const list=cards.filter(c=>(!r||c.raridade===r)&&(!f||c.faccao===f)&&(!q||[c.nome,c.card_id,c.habilidade,c.habilidade_texto,c.descricao,c.faccao,c.fileira].join(' ').toLocaleLowerCase('pt-BR').includes(q)));$('summary').innerHTML=`<span><b>${list.length}</b> de <b>${cards.length}</b> cartas exibidas</span><span><b>${cards.filter(c=>c.expansao_v75).length}</b> da expansão V75</span><span><b>${cards.filter(c=>c.no_pacote).length}</b> no catálogo de pacotes</span>`;if(!list.length){$('grid').innerHTML='<div class="empty">Nenhuma carta corresponde aos filtros.</div>';return} $('grid').innerHTML=list.map(c=>`<article class="card"><div class="top"><div class="name">${esc(c.nome)}</div><span class="pill">${esc(c.raridade)}</span></div><div class="meta"><span>${esc(c.faccao)}</span><span>${esc(c.fileira||'Fileira não definida')}</span><span>${esc(c.categoria)}</span>${c.expansao_v75?'<span>Expansão V75</span>':''}</div><div class="desc">${esc(c.descricao)}</div><div class="skill"><b>${esc(c.habilidade)}</b>${c.habilidade_texto&&c.habilidade_texto!==c.descricao?' — '+esc(c.habilidade_texto):''}</div><div class="foot"><span>${c.no_pacote?'Incluída nos pacotes':'Recompensa especial / fluxo específico'} · Custo ${c.custo}</span><span class="power">${c.poder} POD</span></div></article>`).join('')}
async function init(){try{const r=await fetch('/api/gwent/catalogo-cartas',{credentials:'same-origin',cache:'no-store'});const d=await r.json();if(!r.ok)throw Error(d.error||'Falha ao carregar catálogo');cards=Array.isArray(d.cartas)?d.cartas:[];for(const v of [...new Set(cards.map(c=>c.raridade))].sort((a,b)=>['Comum','Rara','Épica','Lendária','Mítica','Primordial','Singular'].indexOf(a)-['Comum','Rara','Épica','Lendária','Mítica','Primordial','Singular'].indexOf(b))){const o=document.createElement('option');o.value=v;o.textContent=v;$('rarity').append(o)}for(const v of [...new Set(cards.map(c=>c.faccao))].sort()){const o=document.createElement('option');o.value=v;o.textContent=v;$('faction').append(o)}render()}catch(e){$('summary').textContent='Não foi possível carregar o catálogo.';$('grid').innerHTML=`<div class="error">${esc(e.message)}</div>`}}
['q','rarity','faction'].forEach(id=>$(id).addEventListener(id==='q'?'input':'change',render));init();
</script></body></html>
