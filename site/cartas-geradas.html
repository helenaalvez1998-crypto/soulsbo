<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Arquivo Pessoal — Cartas do Coliseu</title>
<style>
:root{color-scheme:dark;--bg:#111318;--panel:#1b1e26;--line:#343945;--muted:#a6adbb;--gold:#d6b66d}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#f2f3f5;font:15px/1.5 system-ui,sans-serif}
main{max-width:1180px;margin:auto;padding:28px 18px}h1,h2{font-family:Georgia,serif}h1{font-size:clamp(28px,4vw,42px);margin:0 0 4px;color:var(--gold)}
.sub{color:var(--muted);margin-bottom:22px}.filters,.summary,.card,.report{background:var(--panel);border:1px solid var(--line);border-radius:12px}
.filters{padding:14px;display:grid;grid-template-columns:2fr repeat(4,1fr) auto;gap:9px;margin-bottom:16px}
input,select,button{background:#101218;color:#f2f3f5;border:1px solid var(--line);border-radius:8px;padding:10px;min-width:0}
button{cursor:pointer;background:#51452b;border-color:#8d7540}.summary{display:flex;gap:20px;flex-wrap:wrap;padding:13px 16px;margin-bottom:16px;color:var(--muted)}
.summary strong{color:#fff}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.card{padding:15px;min-height:170px}.card h3{margin:0 0 8px;color:var(--gold)}.meta{color:var(--muted);font-size:13px}.pill{display:inline-block;border:1px solid var(--line);border-radius:99px;padding:2px 8px;margin:5px 4px 0 0;font-size:12px}
footer{display:flex;align-items:center;justify-content:center;gap:16px;padding:20px}.report{margin-top:26px;padding:18px}.report pre{white-space:pre-wrap;color:var(--muted)}
@media(max-width:850px){.filters{grid-template-columns:1fr 1fr}.filters input:first-child{grid-column:1/-1}}
</style><link rel="stylesheet" href="/elden-ui.css?v=v49">  <link rel="stylesheet" href="/narabot-visual-v59.css?v=59">
<style id="nb-inline">/* NARABOT — camada final de acabamento visual (carregada por último) */
:root{--r-lg:20px;--card:linear-gradient(180deg,rgba(255,255,255,.045),rgba(255,255,255,.012)),var(--panel,#15131c);--bd:1px solid rgba(224,189,123,.16);--bd-hi:1px solid rgba(224,189,123,.42);--sh:0 10px 34px rgba(0,0,0,.35);--sp:clamp(14px,2vw,24px)}
html{scroll-behavior:smooth}
body{background:radial-gradient(1200px 600px at 50% -10%,rgba(155,120,196,.14),transparent 60%),radial-gradient(900px 500px at 100% 100%,rgba(224,189,123,.07),transparent 55%),var(--bg)}
::selection{background:rgba(224,189,123,.35)}
*{scrollbar-width:thin;scrollbar-color:#4a3f55 transparent}
:focus-visible{outline:2px solid var(--gold-bright,#f3d69b);outline-offset:2px;border-radius:8px}
main{max-width:1360px;margin-inline:auto;padding-inline:var(--sp)}
h1,h2,h3{font-family:Cinzel,Georgia,serif;letter-spacing:.04em}

/* topo */
.hud{background:linear-gradient(180deg,rgba(14,12,20,.97),rgba(10,9,15,.92));border-bottom:1px solid rgba(224,189,123,.28);box-shadow:0 8px 30px rgba(0,0,0,.45)}
.brand b{font-family:Cinzel,serif;letter-spacing:.14em;color:var(--gold-bright)}
.brand small{letter-spacing:.28em;opacity:.7}
.sigil{filter:drop-shadow(0 0 8px rgba(224,189,123,.5))}
.hud .nav{border-radius:10px;transition:background .2s,color .2s}
.hud .nav:hover{background:rgba(224,189,123,.08)}
.hud .nav.active{background:linear-gradient(180deg,rgba(224,189,123,.18),rgba(224,189,123,.05));box-shadow:inset 0 -2px 0 var(--gold)}
.wallet span{background:rgba(0,0,0,.35);border:var(--bd);border-radius:999px;padding:4px 10px}

/* títulos e seções */
.screen-title{margin:22px 0 14px}
.screen-title h1{font-size:clamp(26px,3.4vw,40px);margin:0;background:linear-gradient(180deg,#fff2d0,var(--gold) 75%);-webkit-background-clip:text;background-clip:text;color:transparent}
.eyebrow{font:700 11px Inter,sans-serif;letter-spacing:.22em;color:var(--gold);opacity:.85;text-transform:uppercase}
.section-head{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;margin:26px 0 14px;padding-bottom:10px;border-bottom:1px solid rgba(224,189,123,.14);position:relative}
.section-head::after{content:"";position:absolute;left:0;bottom:-1px;width:64px;height:2px;background:linear-gradient(90deg,var(--gold),transparent)}
.section-head h3{margin:2px 0 0;font-size:clamp(18px,2vw,24px)}
.text-btn{color:var(--gold-bright);text-decoration:none;font-size:13px;white-space:nowrap}
.text-btn:hover{text-decoration:underline}

/* cards */
.hub-card,.pt-card,.effect-card,.cd-box,.sys-group{background:var(--card);border:var(--bd);border-radius:var(--r-lg);box-shadow:var(--sh)}
.hub-card{padding:var(--sp);transition:border-color .2s}
.hub-card:hover{border-color:rgba(224,189,123,.34)}
.hub-hero{border-radius:24px;border:var(--bd-hi);background:radial-gradient(700px 300px at 0 0,rgba(224,189,123,.16),transparent 60%),var(--card);padding:clamp(18px,3vw,36px);box-shadow:var(--sh),inset 0 1px 0 rgba(255,255,255,.06)}
.hub-hero h2{font-size:clamp(28px,4vw,46px);margin:.1em 0}
.hub-chips{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}
.hub-chips span{background:rgba(0,0,0,.32);border:var(--bd);border-radius:999px;padding:6px 12px;font-size:13px}
.hub-cta{display:flex;flex-wrap:wrap;gap:10px}
.hub-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:var(--sp);margin:var(--sp) 0}

/* botões e campos */
button.big,a.big,.primary,.secondary{border-radius:12px;transition:transform .18s,filter .18s,box-shadow .18s}
.big:hover,.primary:hover,.secondary:hover{transform:translateY(-2px);filter:brightness(1.1)}
.big:active,.primary:active{transform:none}
.primary,.big.gold{box-shadow:0 6px 20px rgba(224,189,123,.2)}
.seg{display:inline-flex;gap:4px;padding:4px;border-radius:999px;background:rgba(0,0,0,.35);border:var(--bd);max-width:100%;overflow-x:auto}
.seg button{border:0;border-radius:999px;padding:7px 16px;background:transparent;color:var(--muted);transition:.2s}
.seg button.on{background:linear-gradient(180deg,var(--gold-bright),var(--gold));color:#17110a;font-weight:700}
.pt-nav{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}
.pt-pill{border-radius:999px;border:var(--bd);background:rgba(0,0,0,.28);padding:8px 16px;transition:.2s}
.pt-pill.on,.pt-pill:hover{border-color:var(--gold);background:rgba(224,189,123,.14);color:var(--gold-bright)}
input,select,textarea{border-radius:10px;border:1px solid rgba(224,189,123,.2);background:rgba(0,0,0,.35);color:var(--text);transition:border-color .2s,box-shadow .2s}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--gold);box-shadow:0 0 0 3px rgba(224,189,123,.16)}
.notice{border-radius:12px;border:var(--bd);background:rgba(155,120,196,.1)}

/* sistemas do Coliseu (início) */
.sys-wrap{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,290px),1fr));gap:var(--sp)}
.sys-group{padding:16px;box-shadow:none;background:rgba(0,0,0,.2)}
.sys-group h4{margin:0 0 10px;font:700 12px Cinzel,serif;letter-spacing:.18em;color:var(--gold-bright);text-transform:uppercase}
.sys-link{display:flex;gap:12px;align-items:center;padding:10px;border-radius:12px;color:var(--text);text-decoration:none;border:1px solid transparent;transition:.18s}
.sys-link:hover{background:rgba(224,189,123,.09);border-color:rgba(224,189,123,.3);transform:translateX(3px)}
.sys-ico{width:40px;height:40px;flex:none;display:grid;place-items:center;border-radius:11px;font-size:19px;background:linear-gradient(145deg,rgba(224,189,123,.22),rgba(155,120,196,.14));border:var(--bd)}
.sys-link b{display:block;font-size:14px}
.sys-link small{display:block;color:var(--muted);font-size:12px;line-height:1.35}
.sys-soon{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:16px;font-size:12px;color:var(--muted)}
.sys-soon span{padding:3px 10px;border-radius:999px;border:1px dashed rgba(224,189,123,.3)}

/* guia, efeitos, ganhos, catálogo */
.effect-grid,.earn-grid,.cat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,250px),1fr));gap:12px}
.earn-grid{list-style:none;padding:0;margin:14px 0}
.earn-grid li{display:flex;gap:12px;align-items:center;padding:12px 14px;border:var(--bd);border-radius:14px;background:rgba(0,0,0,.22)}
.earn-grid li i{font-size:24px;font-style:normal}
.earn-grid li span{display:block;font-size:13px;color:var(--muted)}
.effect-card{padding:14px 16px;transition:transform .2s,border-color .2s}
.effect-card:hover{transform:translateY(-2px);border-color:rgba(224,189,123,.4)}
.effect-code{font:700 10px Inter,sans-serif;letter-spacing:.16em;color:var(--gold);opacity:.8}
.effect-card h4{margin:.35em 0 .25em;font:700 15px Cinzel,serif}
.effect-card p{margin:0;font-size:13.5px;line-height:1.5;color:var(--muted)}
.effect-group-head{display:flex;justify-content:space-between;align-items:center;margin:24px 0 12px}
.effect-group-head span{font-size:12px;padding:3px 10px;border-radius:999px;background:rgba(224,189,123,.12);color:var(--gold-bright)}
.sec-title{text-align:center;margin:40px 0 18px}
.sec-title h2{margin:.15em 0;font-size:clamp(22px,3vw,32px)}

footer{margin-top:48px;padding:26px 16px;text-align:center;border-top:1px solid rgba(224,189,123,.18);font:700 12px Cinzel,serif;letter-spacing:.2em;color:var(--gold)}
footer span{display:block;margin-top:6px;font:12px Inter,sans-serif;letter-spacing:.04em;color:var(--muted)}
.tab.show{animation:tabIn .35s ease both}
@keyframes tabIn{from{opacity:0;transform:translateY(8px)}}
@media(max-width:700px){.hub-cta .big{flex:1 1 100%}.section-head{flex-wrap:wrap}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}html{scroll-behavior:auto}}
/* NARABOT — sistemas do Coliseu: visual unificado das páginas internas e do bloco da Início */
body{background:radial-gradient(1000px 520px at 50% -8%,rgba(155,120,196,.16),transparent 60%),radial-gradient(800px 480px at 100% 100%,rgba(224,189,123,.08),transparent 55%),#0b0a10!important;color:#f1ebe0}
main,.wrap{max-width:1180px!important;margin-inline:auto;padding:26px clamp(14px,3vw,28px) 80px!important}
main>p,.wrap>p{max-width:72ch;font-size:15.5px;line-height:1.65}
.sx-nav{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:12px;padding:10px clamp(12px,3vw,28px);background:rgba(11,10,16,.9);backdrop-filter:blur(12px);border-bottom:1px solid rgba(224,189,123,.22)}
.sx-home{flex:none;color:#f3d69b;text-decoration:none;font-weight:700;font-size:13px;padding:8px 12px;border-radius:10px;border:1px solid rgba(224,189,123,.3)}
.sx-tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.sx-tabs a{flex:none;display:flex;gap:7px;align-items:center;padding:8px 13px;border-radius:999px;color:#b9afc0;text-decoration:none;font-size:13px;font-weight:600;transition:.18s}
.sx-tabs a:hover{color:#f3d69b;background:rgba(224,189,123,.08)}
.sx-tabs a.on{color:#17110a;background:linear-gradient(180deg,#f3d69b,#d5ad69);box-shadow:0 4px 16px rgba(224,189,123,.25)}
.sx-tabs i{font-style:normal}
.top{padding:22px clamp(16px,3vw,30px);margin-bottom:18px;border-radius:22px;border:1px solid rgba(224,189,123,.35);background:radial-gradient(600px 220px at 0 0,rgba(224,189,123,.16),transparent 65%),linear-gradient(180deg,rgba(255,255,255,.04),rgba(255,255,255,.01))}
h1{font-family:Cinzel,Georgia,serif!important;background:linear-gradient(180deg,#fff2d0,#d5ad69 80%);-webkit-background-clip:text;background-clip:text;color:transparent!important}
h2,h3,h4{font-family:Cinzel,Georgia,serif;color:#f3dfb8}
.card,.panel,.recipe,.step,.result,.stat,.lore{background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,.012)),#16131c!important;border:1px solid rgba(224,189,123,.18)!important;border-radius:18px!important;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.card{transition:transform .2s,border-color .2s}
.card:hover{transform:translateY(-3px);border-color:rgba(224,189,123,.5)!important}
.name{font-family:Cinzel,Georgia,serif!important;color:#f3dfb8!important}
.stats .stat b{font:800 24px Cinzel,serif;color:#f3d69b}
.btn{border-radius:11px!important;border:1px solid rgba(224,189,123,.4)!important;background:rgba(224,189,123,.08)!important;color:#f3d69b!important;transition:.18s}
.btn:hover:not(:disabled){transform:translateY(-1px);background:rgba(224,189,123,.18)!important}
.btn.primary{background:linear-gradient(180deg,#f3d69b,#d5ad69)!important;color:#17110a!important;font-weight:800}
input,select,textarea{border-radius:11px!important;border:1px solid rgba(224,189,123,.22)!important;background:rgba(0,0,0,.38)!important;color:#f1ebe0}
input:focus,select:focus,textarea:focus{outline:0;border-color:#d5ad69!important;box-shadow:0 0 0 3px rgba(224,189,123,.16)}
.step-num{display:grid;place-items:center;flex:none;width:38px;height:38px;border-radius:50%;background:linear-gradient(145deg,#f3d69b,#b98f4c);color:#17110a;font-weight:800}
.tip,.note{border-left:3px solid #d5ad69;background:rgba(224,189,123,.07);padding:10px 14px;border-radius:0 12px 12px 0}
.pager{padding:10px;border-radius:999px}
/* bloco da Início */
#coliseu-systems{border-color:rgba(224,189,123,.4);background:radial-gradient(700px 260px at 100% 0,rgba(155,120,196,.14),transparent 60%),var(--card)}
.sys-wrap{gap:18px}.sys-group{padding:18px;border-radius:18px}
.sys-link{padding:12px;margin-bottom:6px;background:rgba(255,255,255,.025);border-color:rgba(224,189,123,.12)}
.sys-link::after{content:"→";margin-left:auto;color:#d5ad69;opacity:0;transition:.18s}
.sys-link:hover::after{opacity:1}
.sys-ico{width:46px;height:46px;font-size:22px}
@media(max-width:600px){.sx-home{display:none}}
.sys-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,250px),1fr));gap:14px}
.sys-card{position:relative;display:flex!important;flex-direction:column;gap:8px;padding:20px 18px 16px;border-radius:18px;text-decoration:none!important;color:#f1ebe0!important;background:linear-gradient(180deg,rgba(255,255,255,.06),rgba(255,255,255,.015)),#16131c;border:1px solid rgba(224,189,123,.3);box-shadow:0 8px 24px rgba(0,0,0,.4);overflow:hidden;transition:transform .2s,border-color .2s,box-shadow .2s}
.sys-card::before{content:"";position:absolute;inset:0 0 auto;height:3px;background:linear-gradient(90deg,#d5ad69,#9b78c4)}
.sys-card:hover{transform:translateY(-4px);border-color:#d5ad69;box-shadow:0 14px 34px rgba(0,0,0,.5)}
.sys-card .sys-ico{width:54px;height:54px;font-size:27px;display:grid;place-items:center;border-radius:14px;background:linear-gradient(145deg,rgba(224,189,123,.25),rgba(155,120,196,.16));border:1px solid rgba(224,189,123,.3)}
.sys-card b{font:700 16px Cinzel,Georgia,serif;letter-spacing:.05em;color:#f3dfb8;text-transform:uppercase}
.sys-card small{color:#b9afc0;font-size:13px;line-height:1.4}
.sys-tag{align-self:flex-start;font:700 10px Inter,sans-serif;letter-spacing:.16em;text-transform:uppercase;color:#d5ad69;padding:3px 9px;border:1px solid rgba(224,189,123,.3);border-radius:999px}
.sys-go{margin-top:auto;padding-top:8px;font-weight:700;font-size:13px;color:#f3d69b}
</style>
</head>
<body><main>
<h1>Arquivo Pessoal</h1><div class="sub">Cartas geradas por transmutação. Cada carta permanece vinculada ao seu criador.</div>
<section class="filters">
<input id="q" placeholder="Buscar nome, lore ou ID">
<select id="faction"><option value="">Todas as facções</option><option>Ordem Áurea</option><option>Véu Carmesim</option><option>Lua Negra</option></select>
<select id="rarity"><option value="">Todas as raridades</option><option>Comum</option><option>Rara</option><option>Épica</option><option>Lendária</option><option>Mítica</option></select>
<select id="affinity"><option value="">Todas as afinidades</option><option>sagrado</option><option>fogo</option><option>sangue</option><option>morte</option><option>lua</option><option>magia</option><option>relampago</option><option>gravidade</option><option>gelo</option><option>veneno</option><option>ancestral</option><option>bestial</option></select>
<select id="role"><option value="">Todas as funções</option><option value="ataque">Ataque</option><option value="defesa">Defesa</option><option value="controle">Controle</option><option value="suporte">Suporte</option></select>
<button id="search">Filtrar</button>
</section>
<section id="summary" class="summary">Carregando coleção…</section>
<section id="cards" class="grid"></section>
<footer><button id="prev">Anterior</button><span id="pagination">Página 1</span><button id="next">Próxima</button></footer>
<section class="report"><h2>Diagnóstico competitivo agregado</h2><div id="balance">Carregando métricas…</div></section>
</main>
<script>
let page=1,pages=1;
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function load(){
 const p=new URLSearchParams({page:String(page),page_size:'24',q:$('q').value,faction:$('faction').value,rarity:$('rarity').value,affinity:$('affinity').value,role:$('role').value});
 const r=await fetch('/api/gwent/cartas-geradas?'+p,{credentials:'same-origin'});
 if(!r.ok){$('cards').textContent='Não foi possível carregar a coleção.';return}
 const d=await r.json();pages=d.pages||1;
 const s=d.summary||{};$('summary').innerHTML=`<span>Total: <strong>${s.total||0}</strong></span><span>Artes prontas: <strong>${s.artes_prontas||0}</strong></span><span>Artes pendentes: <strong>${s.artes_pendentes||0}</strong></span><span>Por raridade: <strong>${esc(Object.entries(s.por_raridade||{}).map(x=>x.join(': ')).join(' · ')||'—')}</strong></span>`;
 $('cards').innerHTML=(d.items||[]).map(c=>{let x=c.definition||{};return `<article class="card"><h3>${esc(c.name)}</h3><div class="meta">${esc(c.faction)} · ${esc(c.rarity)} · Poder ${esc(c.power)}</div><p>${esc(x.descricao||'Sem descrição registrada.')}</p><span class="pill">${esc(x.funcao_tatica||'função não definida')}</span>${(x.afinidades||[]).map(a=>`<span class="pill">${esc(a)}</span>`).join('')}<div class="meta" style="margin-top:12px">Arte: ${c.art_ready?'validada/armazenada':'pendente'} · ${esc(c.card_id)}</div><p><a href="/atelie-arte?card_id=${encodeURIComponent(c.card_id)}" style="color:var(--gold)">Abrir Ateliê de Arte →</a></p></article>`}).join('')||'<p>Nenhuma carta encontrada com esses filtros.</p>';
 $('pagination').textContent=`Página ${d.page} de ${d.pages} · ${d.total} cartas`; $('prev').disabled=page<=1;$('next').disabled=page>=pages;
}
async function balance(){
 const r=await fetch('/api/gwent/transmutacao/balanceamento',{credentials:'same-origin'});
 if(!r.ok){$('balance').textContent='Métricas indisponíveis.';return}
 const d=await r.json();
 $('balance').innerHTML=`<div class="summary"><span>Amostra: <strong>${d.total}</strong></span><span>Com habilidade: <strong>${d.percentual_com_habilidade}%</strong></span><span>Sem habilidade: <strong>${d.percentual_sem_habilidade}%</strong></span><span>Desvio da meta: <strong>${d.desvio_meta_50_50_pp} p.p.</strong></span></div><pre>${esc((d.alertas||[]).join('\\n')||'Nenhum alerta estatístico nesta amostra.')}\n\n${esc(d.nota)}</pre>`;
}
$('search').onclick=()=>{page=1;load()};$('prev').onclick=()=>{page=Math.max(1,page-1);load()};$('next').onclick=()=>{page=Math.min(pages,page+1);load()};
load();balance();
</script></body></html>
